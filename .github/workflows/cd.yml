name: CD

on:
  push:
    branches: [main]

jobs:
  deploy-client:
    name: Deploy client
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_KATA }}:latest

      - name: Request Render to deploy this image
        shell: bash
        run: |
          set -euo pipefail
          image_url="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY_KATA }}:latest"
          curl --fail-with-body --silent --show-error \
            --get \
            --data-urlencode "imgURL=${image_url}" \
            "${{ secrets.RENDER_KATA }}"
